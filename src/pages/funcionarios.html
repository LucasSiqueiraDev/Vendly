<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendly - Funcionários</title>
</head>

<body>

    <vendly-shell>
        <div class="container-fluid p-0">

            <!-- Cabeçalho da Tela -->
            <vendly-page-header title="Lista de Funcionários" button-text="Novo Funcionário"
                button-id="btnCriarFuncionario">
            </vendly-page-header>

            <!-- Card com a Tabela -->
            <div class="card border-0 shadow-sm rounded-3">
                <div class="card-body p-4">
                    <vendly-table id="tabelaFuncionariosComponent" table-id="tabelaFuncionarios"></vendly-table>
                </div>
            </div>

            <!-- Modal Reutilizável de Detalhes -->
            <vendly-modal id="modalFuncionarios" modal-id="modalDetalhesFuncionario"
                title="Detalhes do Funcionário"></vendly-modal>

        </div>
    </vendly-shell>

    <script type="module" src="/src/app.js"></script>

    <!-- Script específico da página de Funcionários -->
    <script type="module">
        import { getFuncionarios } from '/src/apiServices/endpoints/funcionarioService.js';

        document.addEventListener("DOMContentLoaded", async () => {
            // Mapeamento das colunas da tabela
            const colunasFuncionarios = [
                { title: "Nome", data: "nome" },
                { title: "Telefone", data: "telefone" },
                { title: "E-mail", data: "email" },
                {
                    title: "Nível de Acesso",
                    data: "nivelAcesso",
                    render: function (data) {
                        return `<span class="badge bg-primary-subtle text-primary border border-primary px-2 py-1 fw-semibold">${data}</span>`;
                    }
                },
                {
                    title: "Status",
                    data: "status",
                    render: function (data) {
                        const isAtivo = data === "Ativo";
                        const badgeClass = isAtivo
                            ? "bg-success-subtle text-success border border-success"
                            : "bg-danger-subtle text-danger border border-danger";

                        return `<span class="badge ${badgeClass} px-2 py-1 fw-semibold">${data}</span>`;
                    }
                }
            ];

            // Garante o carregamento dos Web Components
            await customElements.whenDefined("vendly-table");
            await customElements.whenDefined("vendly-modal");

            const funcionarios = await getFuncionarios();
            const tabelaComponent = document.querySelector("#tabelaFuncionariosComponent");
            const modalComponent = document.querySelector("#modalFuncionarios");

            if (tabelaComponent) {
                tabelaComponent.inicializarTabela(colunasFuncionarios, funcionarios);

                // Quando clicar na linha da tabela, monta os dados e abre o modal
                tabelaComponent.addEventListener("row-click", (e) => {
                    const { data, colunas } = e.detail;

                    let conteudoHtml = '<ul class="list-group list-group-flush">';
                    colunas.forEach(col => {
                        if (col.data && data[col.data] !== undefined) {
                            conteudoHtml += `
                                <li class="list-group-item d-flex justify-content-between align-items-center px-0 py-2">
                                    <span class="fw-semibold text-secondary">${col.title}:</span>
                                    <span class="text-dark fw-bold">${data[col.data]}</span>
                                </li>
                            `;
                        }
                    });
                    conteudoHtml += '</ul>';

                    // Abre o modal passando os dados do funcionário
                    modalComponent.abrir(`Funcionário: ${data.nome}`, conteudoHtml, data);
                });
            }

            // Escuta o evento do botão "Editar" do modal
            if (modalComponent) {
                modalComponent.addEventListener("edit-click", (e) => {
                    const funcionarioParaEditar = e.detail.itemData;
                    console.log("Funcionário selecionado para edição:", funcionarioParaEditar);
                });
            }
        });
    </script>
</body>

</html>
