<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendly - Fornecedores</title>
</head>

<body>

    <vendly-shell>
        <div class="container-fluid p-0">

            <!-- Cabeçalho da Tela -->
            <vendly-page-header title="Lista de Fornecedores" button-text="Criar Fornecedor"
                button-id="btnCriarFornecedor">
            </vendly-page-header>

            <!-- Card com a Tabela -->
            <div class="card border-0 shadow-sm rounded-3">
                <div class="card-body p-4">
                    <vendly-table id="tabelaFornecedoresComponent" table-id="tabelaFornecedores"></vendly-table>
                </div>
            </div>

            <!-- Modal Reutilizável de Detalhes -->
            <vendly-modal id="modalFornecedores" modal-id="modalDetalhesFornecedor"
                title="Detalhes do Fornecedor"></vendly-modal>

        </div>
    </vendly-shell>

    <script type="module" src="/src/app.js"></script>

    <!-- Script específico da página de Fornecedores -->
    <script type="module">
        import { getFornecedores } from '/src/apiServices/endpoints/fornecedorService.js';

        document.addEventListener("DOMContentLoaded", async () => {
            // Mapeamento das colunas da tabela
            const colunasFornecedores = [
                { title: "Razão Social / Nome", data: "nome" },
                { title: "Telefone", data: "telefone" },
                { title: "E-mail", data: "email" },
                { title: "Contato Direto", data: "contatoDireto" }
            ];

            // Garante o carregamento dos Web Components
            await customElements.whenDefined("vendly-table");
            await customElements.whenDefined("vendly-modal");

            const fornecedores = await getFornecedores();
            const tabelaComponent = document.querySelector("#tabelaFornecedoresComponent");
            const modalComponent = document.querySelector("#modalFornecedores");

            if (tabelaComponent) {
                tabelaComponent.inicializarTabela(colunasFornecedores, fornecedores);

                // Quando clicar na linha da tabela, monta os dados e abre o modal
                tabelaComponent.addEventListener("row-click", (e) => {
                    const { data, colunas } = e.detail;

                    let conteudoHtml = '<ul class="list-group list-group-flush">';
                    colunas.forEach(col => {
                        if (col.data && data[col.data] !== undefined) {
                            conteudoHtml += `
                                <li class="list-group-item d-flex justify-content-between align-items-center px-0 py-2">
                                    <span class="fw-semibold text-secondary">${col.title}:</span>
                                    <span class="text-dark fw-bold">${data[col.data]}</span>
                                </li>
                            `;
                        }
                    });
                    conteudoHtml += '</ul>';

                    // Abre o modal passando os dados para permitir edição futura
                    modalComponent.abrir(`Fornecedor: ${data.nome}`, conteudoHtml, data);
                });
            }

            // Escuta o evento do botão "Editar" do modal
            if (modalComponent) {
                modalComponent.addEventListener("edit-click", (e) => {
                    const fornecedorParaEditar = e.detail.itemData;
                    console.log("Fornecedor selecionado para edição:", fornecedorParaEditar);
                });
            }
        });
    </script>
</body>

</html>
